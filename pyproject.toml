[build-system]
requires = ["setuptools >= 61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dawnpy-tests"
version = "0.1.0"
description = "QA and test orchestration package for Dawn built on top of dawnpy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dawnpy",
  "dawnpy-serial",
  "dawnpy-can",
  "dawnpy-udp",
  "dawnpy-lwm2m",
  "dawnpy-modbus",
  "click>=8.1",
  "ntfc>=0.0.2",
]

[project.urls]
Repository = "https://github.com/railab/dawnpy-tests"
Documentation = "https://railab.github.io/dawn/tools/dawnpy-tests.html"
"Dawn Project" = "https://github.com/railab/dawn"

[project.scripts]
dawnpy-tests = "dawnpy_tests.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dawnpy_tests*"]

[tool.setuptools.package-data]
dawnpy_tests = ["py.typed"]

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 79
