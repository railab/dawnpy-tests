[tox]
requires =
    tox>=4
env_list = format, flake8, type, py

[testenv]
description = run dawnpy-tests extension tests
skip_install = true
deps =
    click>=8.1
    prompt_toolkit>=3.0
    pydantic>=2.0
    pyyaml>=6.0
    rich>=13.0
    tomli-w>=1.0
    tree-sitter>=0.25
    tree-sitter-cpp>=0.23
    pyserial>=3.5
    python-can>=4.0
    pymodbus>=3.1,<4
    pytest
    pytest-mock
    pytest-sugar
commands_pre =
    python -m pip install --no-deps -e ../dawnpy
    python -m pip install --no-deps -e ../dawnpy-serial
    python -m pip install --no-deps -e ../dawnpy-can
    python -m pip install --no-deps -e ../dawnpy-udp
    python -m pip install --no-deps -e ../dawnpy-modbus
    python -m pip install --no-deps -e .
commands =
    pytest {posargs}

[testenv:format]
description = run code formatter
skip_install = true
deps =
    isort
    black
commands =
    isort {posargs:src/dawnpy_tests tests}
    black {posargs:src/dawnpy_tests tests}

[testenv:flake8]
description = run flake8
skip_install = true
deps =
    click>=8.1
    prompt_toolkit>=3.0
    pydantic>=2.0
    pyyaml>=6.0
    rich>=13.0
    tomli-w>=1.0
    tree-sitter>=0.25
    tree-sitter-cpp>=0.23
    pyserial>=3.5
    python-can>=4.0
    pymodbus>=3.1,<4
    flake8
    flake8-bugbear
    flake8-builtins
    flake8-walrus
    flake8-docstrings>=1.3.1
    pep8-naming
commands_pre =
    python -m pip install --no-deps -e ../dawnpy
    python -m pip install --no-deps -e ../dawnpy-serial
    python -m pip install --no-deps -e ../dawnpy-can
    python -m pip install --no-deps -e ../dawnpy-udp
    python -m pip install --no-deps -e ../dawnpy-modbus
    python -m pip install --no-deps -e .
commands =
    flake8 --jobs 1 {posargs:src/dawnpy_tests tests}

[testenv:type]
description = run type checks
sitepackages = true
skip_install = true
deps =
    mypy
    types-PyYAML
commands =
    python -m mypy --strict --pretty {posargs:src/dawnpy_tests}

[pytest]
testpaths = tests
pythonpath = .
norecursedirs = .git .* *.egg* dist build
addopts = -rw
filterwarnings = error

[flake8]
per-file-ignores =
    tests/*: D
ignore =
    E203 W503
